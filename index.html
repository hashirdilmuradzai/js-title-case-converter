<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Title Case Converter</title>
  </head>
  <body>
    <h1>JavaScript Title Case Converter</h1>
    <form onsubmit="titleCase(event)">
      <input id="title-case" type="text" placeholder="Enter Your Text Here" />
      <button type="submit">Convert</button>
    </form>
    <p id="title-case-result"></p>

    <script src="./script.js"></script>
  </body>
</html>
